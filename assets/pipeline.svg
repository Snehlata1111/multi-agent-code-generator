<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1525;stop-opacity:1"/>
    </linearGradient>

    <!-- Card gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f1a30;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="plannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f2218;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a44;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a0f30;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="reviewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2a10;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#221a08;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a3a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f2222;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#13131f;stop-opacity:1"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a371f7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffa657"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#39d0d8"/>
    </marker>
  </defs>

  <!-- Main background -->
  <rect width="1000" height="620" fill="url(#bgGrad)" rx="20"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.3"/>
  </pattern>
  <rect width="1000" height="620" fill="url(#grid)" rx="20" opacity="0.4"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1000" height="3" rx="2" fill="url(#inputGrad)"/>
  <rect x="0" y="0" width="1000" height="3" rx="2">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <line x1="0" y1="3" x2="1000" y2="3" stroke="#4a9eff" stroke-width="2" opacity="0.8"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- TITLE SECTION -->
  <!-- ══════════════════════════════════════════ -->
  <text x="500" y="48" text-anchor="middle" fill="#4a9eff" font-size="11" font-weight="600" letter-spacing="4" opacity="0.8">AI-POWERED DEVELOPMENT PIPELINE</text>
  <text x="500" y="78" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700" letter-spacing="1" filter="url(#titleGlow)">💻 IntelliDev Agent Workflow</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- PIPELINE NODES — y=130, height=110 -->
  <!-- ══════════════════════════════════════════ -->

  <!-- ── NODE 1: User Input ── x=30 -->
  <rect x="30" y="120" width="148" height="110" rx="14" fill="url(#inputGrad)" stroke="#4a9eff" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="30" y="120" width="148" height="4" rx="2" fill="#4a9eff" opacity="0.9"/>
  <!-- icon circle -->
  <circle cx="104" cy="155" r="20" fill="#4a9eff" opacity="0.15"/>
  <text x="104" y="162" text-anchor="middle" font-size="20">📝</text>
  <text x="104" y="185" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">User Input</text>
  <text x="104" y="202" text-anchor="middle" fill="#8b949e" font-size="10">Feature Request</text>
  <!-- status dot -->
  <circle cx="148" cy="128" r="5" fill="#4a9eff" opacity="0.9"/>

  <!-- ── CONNECTOR 1→2 ── -->
  <line x1="178" y1="175" x2="218" y2="175" stroke="#4a9eff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)" opacity="0.9"/>

  <!-- ── NODE 2: Planner Agent ── x=218 -->
  <rect x="218" y="120" width="158" height="110" rx="14" fill="url(#plannerGrad)" stroke="#3fb950" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="218" y="120" width="158" height="4" rx="2" fill="#3fb950" opacity="0.9"/>
  <circle cx="297" cy="155" r="20" fill="#3fb950" opacity="0.12"/>
  <text x="297" y="162" text-anchor="middle" font-size="20">🧠</text>
  <text x="297" y="185" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Planner Agent</text>
  <text x="297" y="202" text-anchor="middle" fill="#8b949e" font-size="10">Architect + Decompose</text>
  <circle cx="366" cy="128" r="5" fill="#3fb950" opacity="0.9"/>

  <!-- ── CONNECTOR 2→3 ── -->
  <line x1="376" y1="175" x2="416" y2="175" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)" opacity="0.9"/>

  <!-- ── NODE 3: Code Generator ── x=416 -->
  <rect x="416" y="120" width="158" height="110" rx="14" fill="url(#codeGrad)" stroke="#a371f7" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="416" y="120" width="158" height="4" rx="2" fill="#a371f7" opacity="0.9"/>
  <circle cx="495" cy="155" r="20" fill="#a371f7" opacity="0.12"/>
  <text x="495" y="162" text-anchor="middle" font-size="20">⚙️</text>
  <text x="495" y="185" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Code Generator</text>
  <text x="495" y="202" text-anchor="middle" fill="#8b949e" font-size="10">Implement Subtask</text>
  <circle cx="564" cy="128" r="5" fill="#a371f7" opacity="0.9"/>

  <!-- ── CONNECTOR 3→4 ── -->
  <line x1="574" y1="175" x2="614" y2="175" stroke="#a371f7" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowPurple)" opacity="0.9"/>

  <!-- ── NODE 4: Reviewer Agent ── x=614 -->
  <rect x="614" y="120" width="158" height="110" rx="14" fill="url(#reviewGrad)" stroke="#ffa657" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="614" y="120" width="158" height="4" rx="2" fill="#ffa657" opacity="0.9"/>
  <circle cx="693" cy="155" r="20" fill="#ffa657" opacity="0.12"/>
  <text x="693" y="162" text-anchor="middle" font-size="20">🔍</text>
  <text x="693" y="185" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Reviewer Agent</text>
  <text x="693" y="202" text-anchor="middle" fill="#8b949e" font-size="10">Audit + Optimize</text>
  <circle cx="762" cy="128" r="5" fill="#ffa657" opacity="0.9"/>

  <!-- ── CONNECTOR 4→5 ── -->
  <line x1="772" y1="175" x2="812" y2="175" stroke="#ffa657" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowOrange)" opacity="0.9"/>

  <!-- ── NODE 5: Output ── x=812 -->
  <rect x="812" y="120" width="158" height="110" rx="14" fill="url(#outputGrad)" stroke="#39d0d8" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="812" y="120" width="158" height="4" rx="2" fill="#39d0d8" opacity="0.9"/>
  <circle cx="891" cy="155" r="20" fill="#39d0d8" opacity="0.12"/>
  <text x="891" y="162" text-anchor="middle" font-size="20">✅</text>
  <text x="891" y="185" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Final Output</text>
  <text x="891" y="202" text-anchor="middle" fill="#8b949e" font-size="10">Production Code</text>
  <circle cx="960" cy="128" r="5" fill="#39d0d8" opacity="0.9"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- VERTICAL CONNECTORS DOWN -->
  <!-- ══════════════════════════════════════════ -->
  <line x1="297" y1="230" x2="297" y2="268" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="495" y1="230" x2="495" y2="268" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="693" y1="230" x2="693" y2="268" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- DETAIL CARDS — y=268 -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Planner detail card -->
  <rect x="178" y="268" width="238" height="148" rx="12" fill="#0f1a1f" stroke="#3fb950" stroke-width="1" opacity="0.95"/>
  <rect x="178" y="268" width="238" height="32" rx="12" fill="#3fb950" opacity="0.12"/>
  <rect x="178" y="288" width="238" height="12" fill="#0f1a1f" opacity="1"/>
  <text x="297" y="288" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="1">PLANNER OUTPUT</text>
  <line x1="188" y1="300" x2="406" y2="300" stroke="#3fb950" stroke-width="0.5" opacity="0.4"/>
  <text x="196" y="320" fill="#8b949e" font-size="10.5">▸  Parses feature request</text>
  <text x="196" y="338" fill="#8b949e" font-size="10.5">▸  Suggests tech stack</text>
  <text x="196" y="356" fill="#8b949e" font-size="10.5">▸  Breaks into subtasks</text>
  <text x="196" y="374" fill="#8b949e" font-size="10.5">▸  Returns structured JSON</text>
  <text x="196" y="392" fill="#4a9eff" font-size="9.5" opacity="0.7">→ User selects subtask</text>

  <!-- Code Gen detail card -->
  <rect x="376" y="268" width="238" height="148" rx="12" fill="#130f1f" stroke="#a371f7" stroke-width="1" opacity="0.95"/>
  <rect x="376" y="268" width="238" height="32" rx="12" fill="#a371f7" opacity="0.12"/>
  <rect x="376" y="288" width="238" height="12" fill="#130f1f" opacity="1"/>
  <text x="495" y="288" text-anchor="middle" fill="#a371f7" font-size="11" font-weight="700" letter-spacing="1">CODE GEN OUTPUT</text>
  <line x1="386" y1="300" x2="604" y2="300" stroke="#a371f7" stroke-width="0.5" opacity="0.4"/>
  <text x="394" y="320" fill="#8b949e" font-size="10.5">▸  Generates named file</text>
  <text x="394" y="338" fill="#8b949e" font-size="10.5">▸  Production-ready code</text>
  <text x="394" y="356" fill="#8b949e" font-size="10.5">▸  Inline comments</text>
  <text x="394" y="374" fill="#8b949e" font-size="10.5">▸  Implementation notes</text>
  <text x="394" y="392" fill="#a371f7" font-size="9.5" opacity="0.7">→ Passed to reviewer</text>

  <!-- Reviewer detail card -->
  <rect x="574" y="268" width="238" height="148" rx="12" fill="#1a1208" stroke="#ffa657" stroke-width="1" opacity="0.95"/>
  <rect x="574" y="268" width="238" height="32" rx="12" fill="#ffa657" opacity="0.12"/>
  <rect x="574" y="288" width="238" height="12" fill="#1a1208" opacity="1"/>
  <text x="693" y="288" text-anchor="middle" fill="#ffa657" font-size="11" font-weight="700" letter-spacing="1">REVIEW OUTPUT</text>
  <line x1="584" y1="300" x2="802" y2="300" stroke="#ffa657" stroke-width="0.5" opacity="0.4"/>
  <text x="592" y="320" fill="#8b949e" font-size="10.5">▸  Bug analysis</text>
  <text x="592" y="338" fill="#8b949e" font-size="10.5">▸  Security improvements</text>
  <text x="592" y="356" fill="#8b949e" font-size="10.5">▸  Performance tips</text>
  <text x="592" y="374" fill="#8b949e" font-size="10.5">▸  Best practices</text>
  <text x="592" y="392" fill="#ffa657" font-size="9.5" opacity="0.7">→ Final reviewed code</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- MODEL BADGE — bottom center -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="270" y="448" width="460" height="60" rx="12" fill="url(#modelGrad)" stroke="#30363d" stroke-width="1.5"/>
  <!-- inner accent -->
  <rect x="270" y="448" width="460" height="3" rx="2" fill="#4a9eff" opacity="0.5"/>

  <text x="340" y="472" fill="#8b949e" font-size="10" font-weight="600" letter-spacing="1">MODEL</text>
  <text x="340" y="490" fill="#e6edf3" font-size="11" font-weight="700">Qwen/Qwen2.5-72B-Instruct</text>

  <line x1="490" y1="455" x2="490" y2="502" stroke="#30363d" stroke-width="1"/>

  <text x="560" y="472" fill="#8b949e" font-size="10" font-weight="600" letter-spacing="1">PROVIDER</text>
  <text x="560" y="490" fill="#e6edf3" font-size="11" font-weight="700">Hugging Face Inference API</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- TECH PILLS — bottom row -->
  <!-- ══════════════════════════════════════════ -->
  <!-- Streamlit pill -->
  <rect x="200" y="530" width="90" height="26" rx="13" fill="#1a2744" stroke="#4a9eff" stroke-width="1"/>
  <text x="245" y="547" text-anchor="middle" fill="#4a9eff" font-size="10" font-weight="600">Streamlit</text>

  <!-- Python pill -->
  <rect x="305" y="530" width="80" height="26" rx="13" fill="#1a3a2a" stroke="#3fb950" stroke-width="1"/>
  <text x="345" y="547" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">Python 3.12</text>

  <!-- HF Hub pill -->
  <rect x="400" y="530" width="100" height="26" rx="13" fill="#2a1a44" stroke="#a371f7" stroke-width="1"/>
  <text x="450" y="547" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">huggingface_hub</text>

  <!-- dotenv pill -->
  <rect x="515" y="530" width="90" height="26" rx="13" fill="#3a2a10" stroke="#ffa657" stroke-width="1"/>
  <text x="560" y="547" text-anchor="middle" fill="#ffa657" font-size="10" font-weight="600">python-dotenv</text>

  <!-- JSON pill -->
  <rect x="620" y="530" width="80" height="26" rx="13" fill="#1a3a3a" stroke="#39d0d8" stroke-width="1"/>
  <text x="660" y="547" text-anchor="middle" fill="#39d0d8" font-size="10" font-weight="600">JSON Parser</text>

  <!-- Footer -->
  <text x="500" y="598" text-anchor="middle" fill="#484f58" font-size="10">IntelliDev Agent · Multi-Agent AI Coding Assistant</text>

</svg>
