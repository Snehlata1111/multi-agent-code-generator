<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1525"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0f1a30"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#0f2218"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a44"/>
      <stop offset="100%" style="stop-color:#1a0f30"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2a10"/>
      <stop offset="100%" style="stop-color:#221a08"/>
    </linearGradient>
    <linearGradient id="cardTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a3a"/>
      <stop offset="100%" style="stop-color:#0f2222"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="50%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a9eff" opacity="0.8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950" opacity="0.8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a371f7" opacity="0.8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffa657" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#bg)" rx="18"/>

  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.12" opacity="0.25"/>
  </pattern>
  <rect width="1000" height="580" fill="url(#grid)" rx="18"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1000" height="3" rx="2" fill="url(#topBar)"/>

  <!-- ══════════════ TITLE ══════════════ -->
  <text x="500" y="44" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="600" letter-spacing="4">INTELLIDEV AGENT</text>
  <text x="500" y="72" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="0.5">AI-Powered Development Pipeline</text>

  <!-- ══════════════ PIPELINE NODES ══════════════ -->

  <!-- NODE 1: Input -->
  <rect x="28" y="108" width="148" height="100" rx="12" fill="url(#cardBlue)" stroke="#4a9eff" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="28" y="108" width="148" height="3" rx="2" fill="#4a9eff"/>
  <!-- Icon: document lines -->
  <rect x="88" y="128" width="28" height="4" rx="2" fill="#4a9eff" opacity="0.7"/>
  <rect x="88" y="136" width="20" height="3" rx="1.5" fill="#4a9eff" opacity="0.4"/>
  <rect x="88" y="143" width="24" height="3" rx="1.5" fill="#4a9eff" opacity="0.4"/>
  <text x="102" y="172" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">User Input</text>
  <text x="102" y="188" text-anchor="middle" fill="#8b949e" font-size="10">Feature Request</text>
  <circle cx="166" cy="116" r="4" fill="#4a9eff" opacity="0.9"/>

  <!-- Arrow 1→2 -->
  <line x1="176" y1="158" x2="214" y2="158" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)" opacity="0.8"/>

  <!-- NODE 2: Planner -->
  <rect x="214" y="108" width="158" height="100" rx="12" fill="url(#cardGreen)" stroke="#3fb950" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="214" y="108" width="158" height="3" rx="2" fill="#3fb950"/>
  <!-- Icon: brain/network dots -->
  <circle cx="285" cy="138" r="5" fill="#3fb950" opacity="0.8"/>
  <circle cx="300" cy="130" r="3.5" fill="#3fb950" opacity="0.5"/>
  <circle cx="300" cy="146" r="3.5" fill="#3fb950" opacity="0.5"/>
  <line x1="290" y1="138" x2="297" y2="131" stroke="#3fb950" stroke-width="1" opacity="0.5"/>
  <line x1="290" y1="138" x2="297" y2="145" stroke="#3fb950" stroke-width="1" opacity="0.5"/>
  <text x="293" y="172" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Planner Agent</text>
  <text x="293" y="188" text-anchor="middle" fill="#8b949e" font-size="10">Architect + Decompose</text>
  <circle cx="362" cy="116" r="4" fill="#3fb950" opacity="0.9"/>

  <!-- Arrow 2→3 -->
  <line x1="372" y1="158" x2="410" y2="158" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)" opacity="0.8"/>

  <!-- NODE 3: Code Generator -->
  <rect x="410" y="108" width="158" height="100" rx="12" fill="url(#cardPurple)" stroke="#a371f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="108" width="158" height="3" rx="2" fill="#a371f7"/>
  <!-- Icon: code brackets -->
  <text x="489" y="148" text-anchor="middle" fill="#a371f7" font-size="22" font-weight="300" opacity="0.9">&lt;/&gt;</text>
  <text x="489" y="172" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Code Generator</text>
  <text x="489" y="188" text-anchor="middle" fill="#8b949e" font-size="10">Implement Subtask</text>
  <circle cx="558" cy="116" r="4" fill="#a371f7" opacity="0.9"/>

  <!-- Arrow 3→4 -->
  <line x1="568" y1="158" x2="606" y2="158" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)" opacity="0.8"/>

  <!-- NODE 4: Reviewer -->
  <rect x="606" y="108" width="158" height="100" rx="12" fill="url(#cardOrange)" stroke="#ffa657" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="606" y="108" width="158" height="3" rx="2" fill="#ffa657"/>
  <!-- Icon: magnifier -->
  <circle cx="677" cy="136" r="9" fill="none" stroke="#ffa657" stroke-width="2" opacity="0.8"/>
  <line x1="683" y1="143" x2="690" y2="150" stroke="#ffa657" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <text x="685" y="172" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Reviewer Agent</text>
  <text x="685" y="188" text-anchor="middle" fill="#8b949e" font-size="10">Audit + Optimize</text>
  <circle cx="754" cy="116" r="4" fill="#ffa657" opacity="0.9"/>

  <!-- Arrow 4→5 -->
  <line x1="764" y1="158" x2="802" y2="158" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowOrange)" opacity="0.8"/>

  <!-- NODE 5: Output -->
  <rect x="802" y="108" width="168" height="100" rx="12" fill="url(#cardTeal)" stroke="#39d0d8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="802" y="108" width="168" height="3" rx="2" fill="#39d0d8"/>
  <!-- Icon: checkmark -->
  <circle cx="886" cy="138" r="12" fill="none" stroke="#39d0d8" stroke-width="2" opacity="0.6"/>
  <polyline points="879,138 884,144 894,131" fill="none" stroke="#39d0d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="886" y="172" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Final Output</text>
  <text x="886" y="188" text-anchor="middle" fill="#8b949e" font-size="10">Production Code</text>

  <!-- ══════════════ VERTICAL CONNECTORS ══════════════ -->
  <line x1="293" y1="208" x2="293" y2="244" stroke="#3fb950" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="489" y1="208" x2="489" y2="244" stroke="#a371f7" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="685" y1="208" x2="685" y2="244" stroke="#ffa657" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- ══════════════ DETAIL CARDS ══════════════ -->

  <!-- Planner detail -->
  <rect x="174" y="244" width="238" height="136" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.95"/>
  <rect x="174" y="244" width="238" height="28" rx="10" fill="#3fb950" opacity="0.1"/>
  <rect x="174" y="262" width="238" height="10" fill="#0d1117"/>
  <text x="293" y="262" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="700" letter-spacing="1.5">PLANNER OUTPUT</text>
  <line x1="184" y1="272" x2="402" y2="272" stroke="#3fb950" stroke-width="0.5" opacity="0.3"/>
  <text x="192" y="292" fill="#8b949e" font-size="10.5">&#x25B8;  Parses feature request</text>
  <text x="192" y="310" fill="#8b949e" font-size="10.5">&#x25B8;  Recommends tech stack</text>
  <text x="192" y="328" fill="#8b949e" font-size="10.5">&#x25B8;  Breaks into subtasks</text>
  <text x="192" y="346" fill="#8b949e" font-size="10.5">&#x25B8;  Returns structured JSON</text>
  <text x="192" y="366" fill="#4a9eff" font-size="9.5" opacity="0.7">User selects subtask to implement</text>

  <!-- Code Gen detail -->
  <rect x="370" y="244" width="238" height="136" rx="10" fill="#0d1117" stroke="#a371f7" stroke-width="1" opacity="0.95"/>
  <rect x="370" y="244" width="238" height="28" rx="10" fill="#a371f7" opacity="0.1"/>
  <rect x="370" y="262" width="238" height="10" fill="#0d1117"/>
  <text x="489" y="262" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="700" letter-spacing="1.5">CODE GEN OUTPUT</text>
  <line x1="380" y1="272" x2="598" y2="272" stroke="#a371f7" stroke-width="0.5" opacity="0.3"/>
  <text x="388" y="292" fill="#8b949e" font-size="10.5">&#x25B8;  Generates named file</text>
  <text x="388" y="310" fill="#8b949e" font-size="10.5">&#x25B8;  Runnable, structured code</text>
  <text x="388" y="328" fill="#8b949e" font-size="10.5">&#x25B8;  Inline comments</text>
  <text x="388" y="346" fill="#8b949e" font-size="10.5">&#x25B8;  Implementation notes</text>
  <text x="388" y="366" fill="#a371f7" font-size="9.5" opacity="0.7">Passed to Reviewer Agent</text>

  <!-- Reviewer detail -->
  <rect x="566" y="244" width="238" height="136" rx="10" fill="#0d1117" stroke="#ffa657" stroke-width="1" opacity="0.95"/>
  <rect x="566" y="244" width="238" height="28" rx="10" fill="#ffa657" opacity="0.1"/>
  <rect x="566" y="262" width="238" height="10" fill="#0d1117"/>
  <text x="685" y="262" text-anchor="middle" fill="#ffa657" font-size="10" font-weight="700" letter-spacing="1.5">REVIEW OUTPUT</text>
  <line x1="576" y1="272" x2="794" y2="272" stroke="#ffa657" stroke-width="0.5" opacity="0.3"/>
  <text x="584" y="292" fill="#8b949e" font-size="10.5">&#x25B8;  Bug analysis</text>
  <text x="584" y="310" fill="#8b949e" font-size="10.5">&#x25B8;  Security improvements</text>
  <text x="584" y="328" fill="#8b949e" font-size="10.5">&#x25B8;  Performance tips</text>
  <text x="584" y="346" fill="#8b949e" font-size="10.5">&#x25B8;  Best practices</text>
  <text x="584" y="366" fill="#ffa657" font-size="9.5" opacity="0.7">Revised code provided</text>

  <!-- ══════════════ MODEL BADGE ══════════════ -->
  <rect x="270" y="414" width="460" height="56" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <rect x="270" y="414" width="460" height="3" rx="2" fill="#4a9eff" opacity="0.4"/>
  <text x="348" y="436" fill="#8b949e" font-size="9" font-weight="600" letter-spacing="1.5">MODEL</text>
  <text x="348" y="454" fill="#e6edf3" font-size="11" font-weight="600">Qwen/Qwen2.5-72B-Instruct</text>
  <line x1="488" y1="421" x2="488" y2="464" stroke="#21262d" stroke-width="1"/>
  <text x="566" y="436" fill="#8b949e" font-size="9" font-weight="600" letter-spacing="1.5">PROVIDER</text>
  <text x="566" y="454" fill="#e6edf3" font-size="11" font-weight="600">Hugging Face Inference API</text>

  <!-- ══════════════ TECH PILLS ══════════════ -->
  <rect x="196" y="494" width="80" height="24" rx="12" fill="#1a2744" stroke="#4a9eff" stroke-width="1"/>
  <text x="236" y="510" text-anchor="middle" fill="#4a9eff" font-size="10" font-weight="600">Streamlit</text>

  <rect x="292" y="494" width="88" height="24" rx="12" fill="#1a3a2a" stroke="#3fb950" stroke-width="1"/>
  <text x="336" y="510" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">Python 3.12</text>

  <rect x="396" y="494" width="110" height="24" rx="12" fill="#2a1a44" stroke="#a371f7" stroke-width="1"/>
  <text x="451" y="510" text-anchor="middle" fill="#a371f7" font-size="10" font-weight="600">huggingface_hub</text>

  <rect x="522" y="494" width="96" height="24" rx="12" fill="#3a2a10" stroke="#ffa657" stroke-width="1"/>
  <text x="570" y="510" text-anchor="middle" fill="#ffa657" font-size="10" font-weight="600">Prompt Engineering</text>

  <rect x="634" y="494" width="72" height="24" rx="12" fill="#1a3a3a" stroke="#39d0d8" stroke-width="1"/>
  <text x="670" y="510" text-anchor="middle" fill="#39d0d8" font-size="10" font-weight="600">Pygments</text>

  <!-- Footer -->
  <text x="500" y="556" text-anchor="middle" fill="#30363d" font-size="10">IntelliDev Agent · Multi-Agent AI Coding Assistant · github.com/Snehlata1111/multi-agent-code-generator</text>

</svg>
